# Coolify's Nixpacks image installs Node 22.11, and npm ci skips Vite's
# Linux binding. Reinstall with optional packages, then serve the preview app.
[phases.setup]
nixPkgs = ["nodejs_22", "chromium"]

[phases.install]
cmds = ["NPM_CONFIG_PRODUCTION=false NODE_ENV=development npm install --include=dev --include=optional"]

[phases.build]
cmds = ["NPM_CONFIG_PRODUCTION=false NODE_ENV=development npm run build"]

[start]
cmd = "npm start"
